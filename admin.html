<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Portal - IT Support Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; background-color: #f8fafc; }
        .view { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .view.active { display: flex; opacity: 1; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; border: 2px solid transparent; background-clip: padding-box; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #334155; border: 2px solid transparent; background-clip: padding-box; }
        .scroll-area { -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
        .dark-glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .blob { position: absolute; filter: blur(80px); z-index: 0; opacity: 0.6; animation: float 10s infinite alternate ease-in-out; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 30px) scale(1.1); } }
    </style>
</head>
<body class="fixed inset-0 overflow-hidden w-full h-[100dvh]">

    <div id="login-view" class="view active relative items-center justify-center h-full w-full bg-slate-950 overflow-hidden px-4 md:px-0 z-50">
        <div class="blob bg-indigo-600 w-72 h-72 rounded-full -top-10 -left-10"></div>
        <div class="blob bg-purple-600 w-72 h-72 rounded-full bottom-0 -right-10" style="animation-delay: -5s;"></div>

        <div class="dark-glass max-w-md w-full p-8 md:p-10 text-center rounded-3xl shadow-2xl relative z-10 mx-auto">
            <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center text-2xl font-black mx-auto mb-6 shadow-lg">IT</div>
            <h2 class="text-2xl md:text-3xl font-bold mb-2 text-white tracking-tight">Admin Portal</h2>
            <p class="text-slate-400 mb-8 text-sm font-medium">Secure access to the service desk.</p>
            
            <form onsubmit="window.loginAdmin(event)" class="space-y-4">
                <div><input type="email" id="admin-email" class="w-full bg-slate-900/50 border border-slate-700 text-white px-5 py-3.5 rounded-xl text-sm font-medium focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 placeholder-slate-500 transition-colors" placeholder="admin@company.com" required></div>
                <div><input type="password" id="admin-pwd" class="w-full bg-slate-900/50 border border-slate-700 text-white px-5 py-3.5 rounded-xl text-sm font-medium tracking-widest focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 placeholder-slate-500 transition-colors" placeholder="••••••••" required></div>
                <button id="login-btn" type="submit" class="w-full bg-white text-slate-900 px-6 py-3.5 rounded-xl font-bold text-sm hover:bg-slate-100 transition-all shadow-lg mt-2">Authenticate</button>
            </form>
            
            <p id="login-err" class="text-red-400 text-sm mt-5 font-bold hidden bg-red-400/10 py-2 rounded-lg border border-red-400/20">Invalid credentials.</p>
            <div class="mt-8"><a href="index.html" class="text-slate-500 text-sm font-semibold hover:text-white transition">&larr; Back to User Site</a></div>
        </div>
    </div>

    <div id="mobile-overlay" onclick="window.toggleSidebar()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden lg:hidden transition-opacity"></div>

    <div id="dashboard-view" class="view h-full w-full flex relative overflow-hidden bg-slate-50">
        
        <aside id="sidebar" class="w-[280px] bg-slate-900 flex flex-col z-50 absolute lg:relative inset-y-0 left-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out h-full shadow-2xl border-r border-slate-800">
            <button onclick="window.toggleSidebar()" class="lg:hidden absolute top-5 right-5 text-slate-400 hover:text-white font-black text-2xl p-2">&times;</button>
            
            <div class="h-16 flex items-center px-6 border-b border-slate-800 flex-shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center font-bold text-sm shadow-md">IT</div>
                    <span class="text-lg font-bold tracking-tight text-white">Workspace</span>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto sidebar-scroll pb-4">
                <div class="px-4 pt-6 space-y-1">
                    <p class="px-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Navigation</p>
                    <button class="w-full flex items-center gap-3 px-4 py-2.5 bg-indigo-500/10 text-indigo-400 rounded-xl font-semibold text-sm transition border border-indigo-500/20">
                        Helpdesk Queue
                    </button>
                    <button onclick="window.exportToCSV()" class="w-full flex items-center gap-3 px-4 py-2.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl font-semibold text-sm transition">
                        Export to CSV
                    </button>
                </div>

                <div class="px-4 mt-6">
                    <p class="px-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Filter by Site</p>
                    <button id="nav-site-all" onclick="window.filterBySite('All')" class="nav-site-btn w-full text-left px-4 py-2 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-xl font-semibold text-sm transition mb-1">All Sites</button>
                    <button id="nav-site-mml" onclick="window.filterBySite('MML7ACA48')" class="nav-site-btn w-full text-left px-4 py-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl font-semibold text-sm transition mb-1">MML7ACA48</button>
                    <button id="nav-site-maha" onclick="window.filterBySite('MAHALAXMI')" class="nav-site-btn w-full text-left px-4 py-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl font-semibold text-sm transition mb-1">MAHALAXMI</button>
                </div>

                <div class="px-4 mt-8">
                    <p class="px-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Ticket Activity</p>
                    <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50">
                        <div class="flex justify-between items-center mb-3 px-1">
                            <button onclick="window.changeMonth(-1)" class="text-slate-400 hover:text-white transition p-1">&larr;</button>
                            <span id="calendar-month-year" class="text-xs font-bold text-white uppercase tracking-wider"></span>
                            <button onclick="window.changeMonth(1)" class="text-slate-400 hover:text-white transition p-1">&rarr;</button>
                        </div>
                        <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-slate-400 font-bold mb-2">
                            <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                        </div>
                        <div id="calendar-grid" class="grid grid-cols-7 gap-y-2 gap-x-1 text-center"></div>
                    </div>
                </div>
            </div>
            
            <div class="p-4 border-t border-slate-800 space-y-2 flex-shrink-0">
                <button onclick="window.loadTickets()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-semibold text-sm hover:bg-slate-700 transition border border-slate-700">Sync Data</button>
                <button onclick="window.logoutAdmin()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-slate-400 hover:bg-red-500/10 hover:text-red-400 rounded-xl font-semibold text-sm transition">Logout</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full w-full overflow-hidden relative">
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-20 flex-shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="window.toggleSidebar()" class="lg:hidden text-slate-500 hover:text-indigo-600 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <h1 class="text-lg font-bold tracking-tight text-slate-800 hidden sm:block">Dashboard</h1>
                </div>
                
                <div class="relative flex-shrink-0">
                    <button onclick="window.toggleNotifications()" class="relative p-2 text-slate-500 hover:text-indigo-600 transition bg-slate-50 rounded-full border border-slate-200">
                        <span id="notif-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[9px] font-bold flex items-center justify-center rounded-full hidden">0</span>
                        🔔
                    </button>
                    <div id="notif-dropdown" class="absolute right-0 mt-3 w-[280px] bg-white border border-slate-200 shadow-xl rounded-xl hidden z-50 overflow-hidden">
                        <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <h3 class="font-bold text-slate-800 text-[10px] uppercase tracking-wider">Action Required</h3>
                            <button onclick="window.toggleNotifications()" class="text-slate-400 hover:text-slate-800 text-lg leading-none">&times;</button>
                        </div>
                        <div id="notif-list" class="max-h-[50vh] overflow-y-auto divide-y divide-slate-100 scroll-area"></div>
                    </div>
                </div>
            </header>

            <div class="flex-1 flex flex-col p-4 md:p-6 gap-4 md:gap-6 overflow-hidden w-full">
                <div class="flex-shrink-0 flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-3 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex flex-col sm:flex-row gap-3 flex-1 w-full lg:w-auto">
                        <div class="relative flex-1 min-w-[200px]">
                            <input type="text" oninput="window.searchTable(this.value)" id="search-input" placeholder="Search ID, name, issue..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:bg-white transition font-medium">
                        </div>

                        <select id="dept-filter" onchange="window.filterByDept(this.value)" class="w-full sm:w-auto bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 transition cursor-pointer font-semibold text-slate-700">
                            <option value="All">All Departments</option>
                            <option value="Human Resources">Human Resources</option>
                            <option value="Admin">Admin</option>
                            <option value="Account">Account</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Store*">Store*</option>
                            <option value="Design">Design</option>
                            <option value="Safety">Safety</option>
                            <option value="Civil">Civil</option>
                            <option value="Survey">Survey</option>
                            <option value="P&M">P&M</option>
                            <option value="Planning">Planning</option>
                            <option value="Billing">Billing</option>
                            <option value="DC">DC</option>
                            <option value="QA/QC">QA/QC</option>
                            <option value="MEP">MEP</option>
                            <option value="Electrical">Electrical</option>
                            <option value="Instrumentation">Instrumentation</option>
                            <option value="Executive / Management">Executive / Management</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-2 w-full lg:w-auto">
                        <div id="active-date-badge" class="hidden bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm items-center shadow-sm w-full sm:w-auto">
                            <span class="font-semibold whitespace-nowrap" id="active-date-text"></span>
                            <button onclick="window.filterByDate(null)" class="hover:text-indigo-200 ml-2">&times;</button>
                        </div>
                        
                        <div class="grid grid-cols-3 gap-2 w-full sm:w-auto sm:flex sm:flex-wrap">
                            <div id="btn-filter-all" onclick="window.filterByStatus('All')" class="cursor-pointer transition-all hover:bg-slate-200 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 flex items-center justify-center text-center">
                                <span class="text-xs font-semibold text-slate-600">Total: <span id="stat-total" class="text-slate-900 font-bold">0</span></span>
                            </div>
                            <div id="btn-filter-open" onclick="window.filterByStatus('Open')" class="cursor-pointer transition-all hover:bg-amber-200 bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200 flex items-center justify-center text-center">
                                <span class="text-xs font-semibold text-amber-800">Open: <span id="stat-open" class="font-bold">0</span></span>
                            </div>
                            <div id="btn-filter-resolved" onclick="window.filterByStatus('Resolved')" class="cursor-pointer transition-all hover:bg-emerald-200 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200 flex items-center justify-center text-center">
                                <span class="text-xs font-semibold text-emerald-800">Solved: <span id="stat-resolved" class="font-bold">0</span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex-1 overflow-hidden relative">
                    <div id="admin-ticket-list" class="h-full overflow-y-auto scroll-area space-y-6 pb-10 px-1">
                        <div class="p-10 text-center bg-white border border-slate-200 rounded-xl mx-auto max-w-sm mt-10 shadow-sm">
                            <div class="inline-flex text-indigo-600 font-bold text-sm animate-pulse">Syncing Database...</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://lyeezqunskbluichzljx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5ZWV6cXVuc2tibHVpY2h6bGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzY0NTAsImV4cCI6MjEwNjYxMjQ1MH0.1zyQs2R0C6XYOWoQORp8fBeyOPtCrhEl5kuy6jmeWiU';
        
        let supabaseClient;
        try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } 
        catch(e) { console.error("Supabase Error:", e); }

        window.tickets = [];
        window.searchQuery = "";
        window.currentDeptFilter = "All"; 
        window.currentStatusFilter = "All";
        window.currentSiteFilter = "All"; 
        window.currentFilteredTickets = []; 
        
        let calDate = new Date();
        window.currentDateFilter = null; 

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        };

        window.toggleNotifications = function() { document.getElementById('notif-dropdown').classList.toggle('hidden'); };

        window.updateNotifications = function() {
            const openTickets = window.tickets.filter(t => t.status === 'Open');
            const badge = document.getElementById('notif-badge');
            const list = document.getElementById('notif-list');
            
            if(openTickets.length > 0) {
                badge.innerText = openTickets.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
            
            list.innerHTML = '';
            if(openTickets.length === 0) {
                list.innerHTML = '<div class="p-4 text-center text-slate-400 text-xs font-semibold">No new requests right now.</div>';
                return;
            }
            
            openTickets.slice(0, 5).forEach(t => {
                list.innerHTML += `
                    <div class="p-3 hover:bg-slate-50 transition cursor-pointer border-b border-slate-100" onclick="window.searchFromNotif('${t.id}')">
                        <div class="flex justify-between mb-1">
                            <p class="text-[10px] font-bold text-indigo-600 uppercase">New Request</p>
                            <p class="text-[10px] font-semibold text-slate-400">#${t.id}</p>
                        </div>
                        <p class="text-sm font-semibold text-slate-800 truncate">${t.name}</p>
                    </div>`;
            });
        };

        window.searchFromNotif = function(ticketId) {
            window.toggleNotifications();
            window.filterByDate(null); 
            window.currentDeptFilter = "All";
            window.currentStatusFilter = "All";
            window.filterBySite("All");
            document.getElementById('dept-filter').value = "All";
            const searchBox = document.getElementById('search-input');
            searchBox.value = ticketId;
            window.searchTable(ticketId);
        };

        window.onload = async () => { 
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.showDashboard();
        };

        window.loginAdmin = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errDiv = document.getElementById('login-err');
            btn.innerText = "Authenticating..."; btn.disabled = true; errDiv.classList.add('hidden');
            const { error } = await supabaseClient.auth.signInWithPassword({ 
                email: document.getElementById('admin-email').value.trim(), 
                password: document.getElementById('admin-pwd').value 
            });
            if (error) { errDiv.innerText = error.message; errDiv.classList.remove('hidden'); btn.innerText = "Authenticate"; btn.disabled = false; } 
            else window.showDashboard();
        };
        
        window.showDashboard = function() {
            document.getElementById('login-view').classList.remove('active');
            setTimeout(() => { document.getElementById('dashboard-view').classList.add('active'); window.loadTickets(); }, 50);
        };
        
        window.logoutAdmin = async function() { await supabaseClient.auth.signOut(); window.location.reload(); };

        window.loadTickets = async function() {
            if(!supabaseClient) return alert("Database connection missing.");
            try {
                const { data, error } = await supabaseClient.from('tickets').select('*').order('created_at', { ascending: false });
                if(error) throw error;
                let fetchedTickets = data || [];
                const statusWeight = { 'Open': 1, 'Pending': 2, 'Resolved': 3 };
                fetchedTickets.sort((a, b) => (statusWeight[a.status] || 4) - (statusWeight[b.status] || 4));
                window.tickets = fetchedTickets;
                window.updateNotifications();
                window.renderCalendar(); 
                window.renderTable(); 
            } catch (error) {
                document.getElementById('admin-ticket-list').innerHTML = `<div class="p-6 text-center text-red-600 text-sm bg-red-50 rounded-xl m-4">Database Error: ${error.message}</div>`;
            }
        };

        window.exportToCSV = function() {
            if(!window.currentFilteredTickets || window.currentFilteredTickets.length === 0) {
                return alert("No tickets available to export.");
            }
            const headers = ['Ticket ID', 'Status', 'Date Logged', 'Full Name', 'Emp ID', 'Mobile Number', 'Location (Site)', 'Department', 'Category', 'Priority', 'Description', 'Resolution Notes', 'Assigned Engineer'];
            const rows = window.currentFilteredTickets.map(t => {
                const escapeCsv = (str) => `"${(str || '').toString().replace(/"/g, '""')}"`;
                return [escapeCsv(t.id), escapeCsv(t.status), escapeCsv(t.date || t.created_at), escapeCsv(t.name), escapeCsv(t.empid), escapeCsv(t.mobile), escapeCsv(t.site || 'N/A'), escapeCsv(t.dept), escapeCsv(t.category), escapeCsv(t.priority || 'Normal'), escapeCsv(t.description || t.desc), escapeCsv(t.solution), escapeCsv(t.engineer || 'Unassigned')].join(',');
            });
            const csvContent = headers.join(',') + '\n' + rows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Helpdesk_Export_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        window.changeMonth = function(dir) { calDate.setMonth(calDate.getMonth() + dir); window.renderCalendar(); };

        window.filterByDate = function(dateKey) {
            window.currentDateFilter = (window.currentDateFilter === dateKey) ? null : dateKey;
            const badge = document.getElementById('active-date-badge');
            const text = document.getElementById('active-date-text');
            if (window.currentDateFilter) {
                const parts = dateKey.split('-');
                text.innerText = `${new Date(parts[0], parts[1], parts[2]).toLocaleDateString('en-US', {month: 'short', day: 'numeric'})}`;
                badge.classList.remove('hidden'); badge.classList.add('flex');
            } else {
                badge.classList.add('hidden'); badge.classList.remove('flex');
            }
            window.renderCalendar(); window.renderTable();
            if(window.innerWidth < 1024 && window.currentDateFilter) window.toggleSidebar(); 
        };

        window.renderCalendar = function() {
            const monthYear = document.getElementById('calendar-month-year');
            const grid = document.getElementById('calendar-grid');
            const year = calDate.getFullYear(); const month = calDate.getMonth();
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            monthYear.innerText = `${monthNames[month]} ${year}`;
            grid.innerHTML = '';
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const ticketCounts = {};
            window.tickets.forEach(t => {
                let dStr = t.created_at || t.date; if(!dStr) return;
                let d = new Date(dStr); if(isNaN(d)) return;
                const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                ticketCounts[key] = (ticketCounts[key] || 0) + 1;
            });

            for(let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;
            for(let i = 1; i <= daysInMonth; i++) {
                const key = `${year}-${month}-${i}`;
                const count = ticketCounts[key] || 0;
                let classes = "w-6 h-6 mx-auto rounded-md flex items-center justify-center text-xs cursor-pointer transition relative ";
                if (count > 0) classes += "bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500 hover:text-white font-bold";
                else classes += "text-slate-500 hover:bg-slate-800 font-medium";
                if (window.currentDateFilter === key) classes = classes.replace('bg-indigo-500/20', '').replace('text-indigo-300', '') + " ring-1 ring-indigo-400 bg-indigo-500 text-white font-bold";
                let badge = count > 0 ? `<span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full"></span>` : '';
                grid.innerHTML += `<div onclick="window.filterByDate('${key}')" class="${classes}">${i}${badge}</div>`;
            }
        };

        window.filterByDept = function(dept) { window.currentDeptFilter = dept; window.renderTable(); };
        window.searchTable = function(query) { window.searchQuery = query.toLowerCase(); window.renderTable(); };
        window.filterByStatus = function(status) { window.currentStatusFilter = status; window.renderTable(); };
        
        window.filterBySite = function(site) {
            window.currentSiteFilter = site;
            document.querySelectorAll('.nav-site-btn').forEach(btn => {
                btn.className = "nav-site-btn w-full text-left px-4 py-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl font-semibold text-sm transition mb-1";
            });
            let activeBtnId = 'nav-site-all';
            if(site === 'MML7ACA48') activeBtnId = 'nav-site-mml';
            if(site === 'MAHALAXMI') activeBtnId = 'nav-site-maha';
            const activeBtn = document.getElementById(activeBtnId);
            if(activeBtn) activeBtn.className = "nav-site-btn w-full text-left px-4 py-2 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-xl font-semibold text-sm transition mb-1";
            window.renderTable();
        };

        window.renderTable = function() {
            const list = document.getElementById('admin-ticket-list');
            list.innerHTML = '';
            
            const preStatusFiltered = window.tickets.filter((t) => {
                const desc = t.description || t.desc || ""; 
                if (window.currentDateFilter) {
                    let d = new Date(t.created_at || t.date);
                    if(isNaN(d) || `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` !== window.currentDateFilter) return false;
                }
                if (window.currentDeptFilter !== "All" && t.dept !== window.currentDeptFilter) return false;
                if (window.currentSiteFilter !== "All" && t.site !== window.currentSiteFilter) return false; 
                if (window.searchQuery && !t.name.toLowerCase().includes(window.searchQuery) && !desc.toLowerCase().includes(window.searchQuery) && !t.id.toLowerCase().includes(window.searchQuery)) return false;
                return true;
            });

            document.getElementById('stat-total').innerText = preStatusFiltered.length;
            document.getElementById('stat-open').innerText = preStatusFiltered.filter(t => t.status === 'Open' || t.status === 'Pending').length;
            document.getElementById('stat-resolved').innerText = preStatusFiltered.filter(t => t.status === 'Resolved').length;

            const finalFilteredTickets = preStatusFiltered.filter((t) => {
                if (window.currentStatusFilter === 'Open' && t.status !== 'Open' && t.status !== 'Pending') return false;
                if (window.currentStatusFilter === 'Resolved' && t.status !== 'Resolved') return false;
                return true;
            });
            
            window.currentFilteredTickets = finalFilteredTickets; 

            const baseAll = "cursor-pointer transition-all px-3 py-1.5 rounded-lg border flex items-center justify-center text-center bg-slate-100 border-slate-200 hover:bg-slate-200";
            const baseOpen = "cursor-pointer transition-all px-3 py-1.5 rounded-lg border flex items-center justify-center text-center bg-amber-50 border-amber-200 hover:bg-amber-100";
            const baseResolved = "cursor-pointer transition-all px-3 py-1.5 rounded-lg border flex items-center justify-center text-center bg-emerald-50 border-emerald-200 hover:bg-emerald-100";
            
            document.getElementById('btn-filter-all').className = window.currentStatusFilter === 'All' ? baseAll + " ring-1 ring-slate-400" : baseAll;
            document.getElementById('btn-filter-open').className = window.currentStatusFilter === 'Open' ? baseOpen + " ring-1 ring-amber-400" : baseOpen;
            document.getElementById('btn-filter-resolved').className = window.currentStatusFilter === 'Resolved' ? baseResolved + " ring-1 ring-emerald-400" : baseResolved;

            if(finalFilteredTickets.length === 0) {
                list.innerHTML = `<div class="p-10 text-center text-slate-500 font-medium text-sm bg-white rounded-xl border border-slate-200 shadow-sm mx-auto mt-6">No tickets found.</div>`;
                return;
            }

            finalFilteredTickets.forEach((t) => {
                const desc = t.description || t.desc || "No description provided"; 
                const initials = t.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                
                let sColor = 'bg-slate-50 border-slate-200 text-slate-700';
                let statusBadge = `<span class="bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider">${t.status}</span>`;
                
                if(t.status === 'Resolved') {
                    sColor = 'bg-emerald-50 border-emerald-200 text-emerald-700';
                    statusBadge = `<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider">${t.status}</span>`;
                }
                else if(t.status === 'Pending') {
                    sColor = 'bg-amber-50 border-amber-200 text-amber-700';
                    statusBadge = `<span class="bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider">${t.status}</span>`;
                }

                let pColor = 'bg-blue-50 text-blue-700 border border-blue-200';
                if (t.priority === 'Critical') pColor = 'bg-red-50 text-red-700 border border-red-200';
                else if (t.priority === 'High') pColor = 'bg-orange-50 text-orange-700 border border-orange-200';
                else if (t.priority === 'Low') pColor = 'bg-slate-100 text-slate-600 border border-slate-200';

                let displayDate = t.date;
                try { let d = new Date(t.created_at || t.date); if(!isNaN(d)) displayDate = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch(e) {}

                let solutionDisplay = `<p class="text-[11px] text-amber-600 font-semibold italic mt-3 bg-amber-50 border border-amber-100 px-3 py-1.5 rounded-lg w-max">Pending Solution...</p>`;
                if(t.solution && t.solution.trim() !== '') {
                    solutionDisplay = `
                        <div class="mt-4 p-4 bg-slate-50 border border-slate-200 rounded-xl relative">
                            <span class="absolute -top-2.5 left-4 bg-white text-slate-600 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border border-slate-200">Notes</span>
                            <p class="text-sm text-slate-700 mt-1 whitespace-pre-wrap">${t.solution}</p>
                        </div>`;
                }

                const siteText = t.site || 'Site Unknown';

                list.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col overflow-hidden">
                        <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                            <div class="flex items-center gap-3">
                                <span class="font-extrabold text-lg text-slate-900">#${t.id}</span>
                                ${statusBadge}
                            </div>
                            <div class="text-right hidden sm:block">
                                <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-0.5">Logged</span>
                                <span class="text-xs font-semibold text-slate-700">${displayDate}</span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 lg:grid-cols-12 divide-y lg:divide-y-0 lg:divide-x divide-slate-100">
                            <div class="col-span-1 lg:col-span-3 p-5 flex flex-col">
                                <div class="flex items-center gap-3 mb-4">
                                    <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-sm border border-indigo-100">${initials}</div>
                                    <div class="overflow-hidden">
                                        <p class="font-bold text-slate-900 text-sm truncate">${t.name}</p>
                                        <p class="text-[11px] font-semibold text-slate-500 truncate mt-0.5">${t.dept}</p>
                                    </div>
                                </div>
                                <div class="mt-auto space-y-2">
                                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 flex items-center justify-between">
                                        <p class="text-[9px] uppercase font-bold text-slate-400 tracking-wider">Site Location</p>
                                        <span class="text-xs font-semibold text-slate-700">${siteText}</span>
                                    </div>
                                    <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 flex items-center justify-between">
                                        <p class="text-[9px] uppercase font-bold text-slate-400 tracking-wider">Priority Level</p>
                                        <span class="${pColor} px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">${t.priority || 'Normal'}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="col-span-1 lg:col-span-4 p-5 flex flex-col">
                                <p class="text-[10px] uppercase font-bold text-slate-400 mb-1 tracking-wider">Category</p>
                                <p class="font-semibold text-slate-800 text-xs mb-3 bg-slate-100 px-2 py-1 rounded inline-block w-max">${t.category}</p>
                                <p class="text-[10px] uppercase font-bold text-slate-400 mb-1 tracking-wider">Description</p>
                                <div class="text-sm text-slate-600 leading-relaxed whitespace-pre-wrap">${desc}</div>
                                <div class="mt-auto pt-4">${solutionDisplay}</div>
                            </div>

                            <div class="col-span-1 lg:col-span-5 p-5 bg-slate-50 flex flex-col">
                                <div class="grid grid-cols-2 gap-4 mb-4">
                                    <div>
                                        <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 block tracking-wider">Update Status</label>
                                        <select onchange="window.updateStatus('${t.id}', this.value)" class="${sColor} w-full p-2.5 rounded-lg font-semibold text-xs transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                            <option value="Open" ${t.status === 'Open' ? 'selected' : ''}>Open</option>
                                            <option value="Pending" ${t.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                            <option value="Resolved" ${t.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 block tracking-wider">Assign Agent</label>
                                        <input type="text" value="${t.engineer === 'Unassigned' ? '' : t.engineer}" placeholder="Agent name..." 
                                            onblur="window.assignEngineer('${t.id}', this.value)" class="w-full border border-slate-200 bg-white rounded-lg p-2.5 text-xs font-semibold text-slate-700 focus:border-indigo-500 focus:outline-none transition">
                                    </div>
                                </div>
                                <label class="text-[10px] uppercase font-bold text-slate-400 mb-1 block tracking-wider">Resolution Notes</label>
                                <textarea id="sol-${t.id}" placeholder="Type notes here..." class="flex-1 w-full p-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none resize-none text-sm text-slate-700 min-h-[80px] mb-3">${t.solution || ''}</textarea>
                                <div class="flex gap-2 mt-auto">
                                    <button onclick="window.deleteTicket('${t.id}')" title="Delete Ticket" class="px-3 py-2 bg-white border border-slate-200 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition font-bold flex items-center justify-center">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                    <button onclick="window.updateSolution('${t.id}', event)" class="flex-1 bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-indigo-700 transition text-sm">
                                        Save Notes
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        };

        // NEW: Database-only Status & Solution updates
        window.updateStatus = async function(id, newStatus) {
            try { 
                await supabaseClient.from('tickets').update({ status: newStatus }).eq('id', id); 
                window.loadTickets(); 
            } 
            catch (e) { alert("Failed to update status: " + e.message); }
        };

        window.assignEngineer = async function(id, engName) {
            try { await supabaseClient.from('tickets').update({ engineer: engName.trim() || 'Unassigned' }).eq('id', id); window.loadTickets(); } 
            catch (e) { alert("Failed to assign engineer: " + e.message); }
        };

        window.updateSolution = async function(id, event) {
            const btn = event.target; 
            const textElement = document.getElementById(`sol-${id}`); 
            const text = textElement.value.trim(); 
            const originalText = btn.innerText;
            
            btn.innerText = "Saving...";
            try {
                const { error } = await supabaseClient.from('tickets').update({ solution: text }).eq('id', id);
                if(error) throw error;
                
                btn.innerText = "Saved!"; 
                btn.classList.replace('bg-indigo-600', 'bg-emerald-600'); 
                btn.classList.replace('hover:bg-indigo-700', 'hover:bg-emerald-700');
                
                const t = window.tickets.find(x => x.id === id); 
                if(t) t.solution = text;
                
                setTimeout(() => window.renderTable(), 500);
                setTimeout(() => { 
                    btn.innerText = originalText; 
                    btn.classList.replace('bg-emerald-600', 'bg-indigo-600'); 
                    btn.classList.replace('hover:bg-emerald-700', 'hover:bg-indigo-700'); 
                }, 2000);
            } catch (e) { 
                alert("Database Error: " + e.message); 
                btn.innerText = "Error"; 
                btn.classList.replace('bg-indigo-600', 'bg-red-600'); 
            }
        };

        window.deleteTicket = async function(id) {
            if(confirm('Permanently delete this ticket record?')) {
                try { await supabaseClient.from('tickets').delete().eq('id', id); window.loadTickets(); } 
                catch (e) { alert("Failed to delete ticket: " + e.message); }
            }
        };
    </script>
</body>
</html>
