<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IT Service Desk - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; background-color: #e2e8f0; }
        
        .view { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .view.active { display: flex; opacity: 1; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; border: 2px solid transparent; background-clip: padding-box; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #475569; border: 2px solid transparent; background-clip: padding-box; }

        .scroll-area { -webkit-overflow-scrolling: touch; scrollbar-width: thin; }

        .dark-glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }

        .blob { position: absolute; filter: blur(80px); z-index: 0; opacity: 0.6; animation: float 10s infinite alternate ease-in-out; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 30px) scale(1.1); } }
    </style>
</head>
<body class="fixed inset-0 overflow-hidden w-full h-[100dvh]">

    <!-- ==============================================
         LOGIN VIEW
         ============================================== -->
    <div id="login-view" class="view active relative items-center justify-center h-full w-full bg-slate-950 overflow-hidden px-4 md:px-0 z-50">
        <div class="blob bg-indigo-600 w-72 h-72 md:w-96 md:h-96 rounded-full -top-10 -left-10 md:-top-20 md:-left-20"></div>
        <div class="blob bg-purple-600 w-72 h-72 md:w-96 md:h-96 rounded-full bottom-0 -right-10 md:bottom-10 md:-right-20" style="animation-delay: -5s;"></div>

        <div class="dark-glass max-w-md w-full p-8 md:p-10 text-center rounded-3xl shadow-2xl relative z-10 mx-auto">
            <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-purple-500 text-white rounded-2xl flex items-center justify-center text-2xl font-black mx-auto mb-6 shadow-lg shadow-indigo-500/30">IT</div>
            <h2 class="text-2xl md:text-3xl font-black mb-2 text-white tracking-tight">Admin Portal</h2>
            <p class="text-slate-400 mb-8 text-sm font-medium">Secure access to the service desk.</p>
            
            <form onsubmit="window.loginAdmin(event)" class="space-y-4">

                <div><input type="password" id="admin-pwd" class="w-full bg-slate-900/50 border border-slate-700 text-white px-5 py-3.5 md:py-4 rounded-xl text-[16px] font-medium tracking-widest focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 placeholder-slate-500 transition-colors" placeholder="••••••••" required></div>
                <button id="login-btn" type="submit" class="w-full min-h-[48px] bg-white text-slate-900 px-6 py-3.5 md:py-4 rounded-xl font-bold text-[16px] hover:bg-indigo-50 active:scale-[0.98] transition-all shadow-lg mt-2">Authenticate</button>
            </form>
            
            <p id="login-err" class="text-red-400 text-sm mt-5 font-bold hidden bg-red-400/10 py-2 rounded-lg border border-red-400/20">Invalid credentials.</p>
            <div class="mt-8"><a href="index.html" class="text-slate-500 text-sm font-semibold hover:text-white transition">&larr; Back to User Site</a></div>
        </div>
    </div>

    <!-- ==============================================
         DASHBOARD VIEW
         ============================================== -->
    <div id="mobile-overlay" onclick="window.toggleSidebar()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden lg:hidden transition-opacity"></div>

    <div id="dashboard-view" class="view h-full w-full flex relative overflow-hidden bg-slate-100">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-[280px] bg-slate-900 flex flex-col z-50 absolute lg:relative inset-y-0 left-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out h-full shadow-2xl lg:shadow-none border-r border-slate-800">
            <button onclick="window.toggleSidebar()" class="lg:hidden absolute top-5 right-5 text-slate-400 hover:text-white font-black text-2xl p-2">&times;</button>
            
            <div class="h-16 flex items-center px-6 border-b border-slate-800 flex-shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-gradient-to-tr from-indigo-500 to-purple-500 text-white rounded-lg flex items-center justify-center font-bold text-sm shadow-md">IT</div>
                    <span class="text-lg font-black tracking-tight text-white">Workspace</span>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto sidebar-scroll pb-4">
                <div class="px-4 pt-6 space-y-2">
                    <p class="px-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Navigation</p>
                    <button class="w-full flex items-center gap-3 px-4 py-3 bg-indigo-500/10 text-indigo-400 rounded-xl font-bold transition border border-indigo-500/20">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                        Helpdesk Queue
                    </button>
                    <!-- EXPORT BUTTON ADDED HERE -->
                    <button onclick="window.exportToCSV()" class="w-full flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl font-bold transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Export to CSV
                    </button>
                </div>

                <div class="px-4 mt-8">
                    <p class="px-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Ticket Activity</p>
                    <div class="bg-slate-800/50 rounded-2xl p-4 border border-slate-700/50 shadow-inner">
                        <div class="flex justify-between items-center mb-3 px-1">
                            <button onclick="window.changeMonth(-1)" class="text-slate-400 hover:text-white transition p-1">&larr;</button>
                            <span id="calendar-month-year" class="text-[13px] font-black text-white uppercase tracking-wider"></span>
                            <button onclick="window.changeMonth(1)" class="text-slate-400 hover:text-white transition p-1">&rarr;</button>
                        </div>
                        <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-slate-400 font-bold mb-2">
                            <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                        </div>
                        <div id="calendar-grid" class="grid grid-cols-7 gap-y-2 gap-x-1 text-center"></div>
                    </div>
                </div>
            </div>
            
            <div class="p-4 border-t border-slate-800 space-y-2 flex-shrink-0">
                <button onclick="window.loadTickets()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-800 text-slate-300 rounded-xl font-bold text-sm hover:bg-slate-700 active:scale-95 transition border border-slate-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Sync Data
                </button>
                <button onclick="window.logoutAdmin()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-slate-400 hover:bg-red-500/10 hover:text-red-400 rounded-xl font-semibold active:scale-95 transition text-sm">Logout</button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 flex flex-col h-full w-full overflow-hidden relative">
            
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 z-20 flex-shrink-0 shadow-sm">
                <div class="flex items-center gap-2">
                    <button onclick="window.toggleSidebar()" class="lg:hidden text-slate-500 hover:text-indigo-600 focus:outline-none p-2 rounded-xl active:bg-slate-100">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <h1 class="text-xl font-black tracking-tight text-slate-800 hidden sm:block">Dashboard</h1>
                </div>
                
                <div class="relative flex-shrink-0">
                    <button onclick="window.toggleNotifications()" class="relative p-2 text-slate-500 hover:text-indigo-600 transition bg-slate-50 rounded-full focus:outline-none border border-slate-200 active:scale-95">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span id="notif-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[9px] font-black flex items-center justify-center rounded-full border border-white hidden">0</span>
                    </button>
                    <div id="notif-dropdown" class="absolute right-0 mt-3 w-[280px] bg-white border border-slate-200 shadow-2xl rounded-2xl hidden z-50 overflow-hidden">
                        <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <h3 class="font-black text-slate-800 text-[10px] uppercase tracking-widest">Action Required</h3>
                            <button onclick="window.toggleNotifications()" class="text-slate-400 hover:text-slate-800 text-lg font-bold leading-none">&times;</button>
                        </div>
                        <div id="notif-list" class="max-h-[50vh] overflow-y-auto divide-y divide-slate-100 scroll-area"></div>
                    </div>
                </div>
            </header>

            <div class="flex-1 flex flex-col p-3 md:p-6 gap-4 md:gap-6 overflow-hidden w-full">
                
                <!-- TOOLBAR -->
                <div class="flex-shrink-0 flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-3 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex flex-col sm:flex-row gap-3 flex-1 w-full lg:w-auto">
                        <div class="relative flex-1 min-w-[200px]">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                            <input type="text" oninput="window.searchTable(this.value)" id="search-input" placeholder="Search ID, name, issue..." class="w-full bg-slate-50 border border-slate-300 rounded-lg pl-9 pr-3 py-2 md:py-2.5 text-[16px] md:text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition font-medium">
                        </div>

                        <select id="dept-filter" onchange="window.filterByDept(this.value)" class="w-full sm:w-auto bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 md:py-2.5 text-[16px] md:text-sm focus:outline-none focus:border-indigo-500 transition cursor-pointer font-bold text-slate-700">
                            <option value="All">All Departments</option>
                            <option value="Human Resources">Human Resources</option>
                                <option value="Admin">Admin</option>
                                <option value="Account">Account</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Store*">Store*</option>
                                <option value="Design">Design</option>
                                <option value="Safety">Safety</option>
                                <option value="Civil">Civil</option>
                                <option value="Survey">Survey</option>
                                <option value="P&M">P&M</option>
                                <option value="Planning">Planning</option>
                                <option value="Billing">Billing</option>
                                <option value="DC">DC</option>
                                <option value="QA/QC">QA/QC</option>
                                <option value="MEP">MEP</option>
                                <option value="Electrical">Electrical</option>
                                <option value="Instrumentation">Instrumentation</option>
                                <option value="Executive / Management">Executive / Management</option>
                                <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- METRICS BADGES (CLICKABLE FILTERS) -->
                    <div class="flex flex-col sm:flex-row gap-2 w-full lg:w-auto">
                        
                        <div id="active-date-badge" class="hidden bg-indigo-600 text-white px-3 py-2 rounded-lg border border-indigo-700 items-center justify-between shadow-sm w-full sm:w-auto">
                            <span class="text-xs font-bold whitespace-nowrap" id="active-date-text"></span>
                            <button onclick="window.filterByDate(null)" class="hover:text-red-300 transition text-sm leading-none ml-2">&times;</button>
                        </div>
                        
                        <div class="grid grid-cols-3 gap-2 w-full sm:w-auto sm:flex sm:flex-wrap">
                            <div id="btn-filter-all" onclick="window.filterByStatus('All')" class="cursor-pointer transition-all hover:bg-slate-200 bg-slate-100 px-2 py-1.5 rounded-lg border border-slate-300 flex items-center justify-center text-center">
                                <span class="text-[11px] md:text-xs font-bold text-slate-600">Total: <span id="stat-total" class="text-slate-900 font-black">0</span></span>
                            </div>
                            <div id="btn-filter-open" onclick="window.filterByStatus('Open')" class="cursor-pointer transition-all hover:bg-amber-200 bg-amber-100 px-2 py-1.5 rounded-lg border border-amber-300 flex items-center justify-center text-center">
                                <span class="text-[11px] md:text-xs font-bold text-amber-800">Open: <span id="stat-open" class="font-black">0</span></span>
                            </div>
                            <div id="btn-filter-resolved" onclick="window.filterByStatus('Resolved')" class="cursor-pointer transition-all hover:bg-emerald-200 bg-emerald-100 px-2 py-1.5 rounded-lg border border-emerald-300 flex items-center justify-center text-center">
                                <span class="text-[11px] md:text-xs font-bold text-emerald-800">Solved: <span id="stat-resolved" class="font-black">0</span></span>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- RIGID TICKET CARDS LIST -->
                <div class="flex-1 overflow-hidden relative bg-slate-100">
                    <div id="admin-ticket-list" class="h-full overflow-y-auto scroll-area space-y-8 pb-10 px-1">
                        <div class="p-16 text-center bg-white border-2 border-slate-200 rounded-2xl mx-auto max-w-lg mt-10">
                            <div class="inline-flex items-center gap-3 px-6 py-3 bg-indigo-50 text-indigo-600 rounded-full font-bold text-sm animate-pulse border border-indigo-100">
                                Syncing Cloud Database...
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://lyeezqunskbluichzljx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5ZWV6cXVuc2tibHVpY2h6bGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzY0NTAsImV4cCI6MjEwNjYxMjQ1MH0.1zyQs2R0C6XYOWoQORp8fBeyOPtCrhEl5kuy6jmeWiU';
        
        let supabaseClient;
        try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } 
        catch(e) { console.error("Supabase Initialization Error:", e); }

        window.tickets = [];
        window.searchQuery = "";
        window.currentDeptFilter = "All"; 
        
        // NEW STATUS FILTER STATE
        window.currentStatusFilter = "All";
        window.currentFilteredTickets = []; // for export
        
        let calDate = new Date();
        window.currentDateFilter = null; 

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        };

        window.toggleNotifications = function() {
            const dropdown = document.getElementById('notif-dropdown');
            dropdown.classList.toggle('hidden');
        };

        window.updateNotifications = function() {
            const openTickets = window.tickets.filter(t => t.status === 'Open');
            const badge = document.getElementById('notif-badge');
            const list = document.getElementById('notif-list');
            
            if(openTickets.length > 0) {
                badge.innerText = openTickets.length;
                badge.classList.remove('hidden');
                badge.classList.add('flex');
            } else {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
            
            list.innerHTML = '';
            if(openTickets.length === 0) {
                list.innerHTML = '<div class="p-6 text-center text-slate-400 text-xs font-bold">No new requests right now! 🎉</div>';
                return;
            }
            
            openTickets.slice(0, 5).forEach(t => {
                list.innerHTML += `
                    <div class="p-3 hover:bg-slate-50 transition cursor-pointer border-b border-slate-50" onclick="window.searchFromNotif('${t.id}')">
                        <div class="flex justify-between items-start mb-1">
                            <p class="text-[10px] font-black text-indigo-600 uppercase tracking-wider">New Request</p>
                            <p class="text-[10px] font-bold text-slate-400">#${t.id}</p>
                        </div>
                        <p class="text-sm font-bold text-slate-800 leading-snug truncate">${t.name}</p>
                    </div>
                `;
            });
        };

        window.searchFromNotif = function(ticketId) {
            window.toggleNotifications();
            window.filterByDate(null); 
            window.currentDeptFilter = "All";
            window.currentStatusFilter = "All";
            document.getElementById('dept-filter').value = "All";
            
            const searchBox = document.getElementById('search-input');
            searchBox.value = ticketId;
            window.searchTable(ticketId);
        };

        window.onload = async () => { 
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.showDashboard();
        };

        window.loginAdmin = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errDiv = document.getElementById('login-err');
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-pwd').value;

            btn.innerText = "Authenticating...";
            btn.disabled = true;
            errDiv.classList.add('hidden');

            const { error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });

            if (error) {
                errDiv.innerText = error.message;
                errDiv.classList.remove('hidden');
                btn.innerText = "Authenticate";
                btn.disabled = false;
            } else {
                window.showDashboard();
            }
        };
        
        window.showDashboard = function() {
            document.getElementById('login-view').classList.remove('active');
            setTimeout(() => {
                document.getElementById('dashboard-view').classList.add('active');
                window.loadTickets();
            }, 50);
        };
        
        window.logoutAdmin = async function() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        };

        window.loadTickets = async function() {
            if(!supabaseClient) return alert("Database connection is missing.");
            try {
                const { data, error } = await supabaseClient.from('tickets').select('*').order('created_at', { ascending: false });
                if(error) throw error;
                
                let fetchedTickets = data || [];
                const statusWeight = { 'Open': 1, 'Pending': 2, 'Resolved': 3 };
                fetchedTickets.sort((a, b) => (statusWeight[a.status] || 4) - (statusWeight[b.status] || 4));
                
                window.tickets = fetchedTickets;
                window.updateNotifications();
                window.renderCalendar(); 
                window.renderTable(); 
            } catch (error) {
                const list = document.getElementById('admin-ticket-list');
                list.innerHTML = `<div class="p-10 text-center text-red-500 font-bold text-sm bg-red-50 rounded-xl m-4 border-2 border-red-200">Database Error: ${error.message}</div>`;
            }
        };

        // ==========================================
        // EXPORT FUNCTIONALITY
        // ==========================================
        window.exportToCSV = function() {
            if(!window.currentFilteredTickets || window.currentFilteredTickets.length === 0) {
                alert("No tickets available to export based on current filters.");
                return;
            }
            
            const headers = ['Ticket ID', 'Status', 'Date', 'Name', 'Emp ID', 'Department', 'Category', 'Priority', 'Description', 'Solution', 'Assigned Engineer'];
            
            const rows = window.currentFilteredTickets.map(t => {
                const desc = (t.description || t.desc || "").replace(/"/g, '""');
                const sol = (t.solution || "").replace(/"/g, '""');
                return [
                    t.id,
                    t.status,
                    t.date || t.created_at || '',
                    t.name || '',
                    t.empid || '',
                    t.dept || '',
                    t.category || '',
                    t.priority || 'Normal',
                    `"${desc}"`,
                    `"${sol}"`,
                    t.engineer || 'Unassigned'
                ].join(',');
            });
            
            const csvContent = headers.join(',') + '\n' + rows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Helpdesk_Export_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // ==========================================
        // CALENDAR LOGIC
        // ==========================================
        window.changeMonth = function(dir) {
            calDate.setMonth(calDate.getMonth() + dir);
            window.renderCalendar();
        };

        window.filterByDate = function(dateKey) {
            if (window.currentDateFilter === dateKey) window.currentDateFilter = null; 
            else window.currentDateFilter = dateKey;
            
            const badge = document.getElementById('active-date-badge');
            const text = document.getElementById('active-date-text');
            
            if (window.currentDateFilter) {
                const parts = dateKey.split('-');
                const d = new Date(parts[0], parts[1], parts[2]);
                text.innerText = `${d.toLocaleDateString('en-US', {month: 'short', day: 'numeric'})}`;
                badge.classList.remove('hidden');
                badge.classList.add('flex');
            } else {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
            window.renderCalendar();
            window.renderTable();
            if(window.innerWidth < 1024 && window.currentDateFilter) window.toggleSidebar(); 
        };

        window.renderCalendar = function() {
            const monthYear = document.getElementById('calendar-month-year');
            const grid = document.getElementById('calendar-grid');
            const year = calDate.getFullYear();
            const month = calDate.getMonth();
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            
            monthYear.innerText = `${monthNames[month]} ${year}`;
            grid.innerHTML = '';
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            const ticketCounts = {};
            window.tickets.forEach(t => {
                let dStr = t.created_at || t.date;
                if(!dStr) return;
                let d = new Date(dStr);
                if(isNaN(d)) return;
                const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                ticketCounts[key] = (ticketCounts[key] || 0) + 1;
            });

            for(let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;
            
            for(let i = 1; i <= daysInMonth; i++) {
                const key = `${year}-${month}-${i}`;
                const count = ticketCounts[key] || 0;
                
                let classes = "w-7 h-7 mx-auto rounded-full flex items-center justify-center text-xs cursor-pointer transition-all relative ";
                
                if (count > 0) classes += "bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500 hover:text-white font-bold border border-indigo-500/30";
                else classes += "text-slate-400 hover:bg-slate-700 font-medium";
                
                if (window.currentDateFilter === key) {
                    classes = classes.replace('bg-indigo-500/20', '').replace('text-indigo-400', '');
                    classes += " ring-2 ring-indigo-400 ring-offset-2 ring-offset-slate-800 bg-indigo-500 text-white font-black";
                }
                
                let badge = '';
                if(count > 0) badge = `<span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full text-[7px] flex items-center justify-center text-white font-black shadow-sm border border-slate-800">${count}</span>`;

                grid.innerHTML += `<div onclick="window.filterByDate('${key}')" class="${classes}">${i}${badge}</div>`;
            }
        };

        // ==========================================
        // RIGID CARD RENDERING
        // ==========================================
        window.filterByDept = function(dept) {
            window.currentDeptFilter = dept;
            window.renderTable();
        };

        window.searchTable = function(query) {
            window.searchQuery = query.toLowerCase();
            window.renderTable();
        };
        
        window.filterByStatus = function(status) {
            window.currentStatusFilter = status;
            window.renderTable();
        };

        window.renderTable = function() {
            const list = document.getElementById('admin-ticket-list');
            list.innerHTML = '';
            
            // 1. First filter by Date, Dept, and Search (Pre-Status Filtering for accurate stats)
            const preStatusFiltered = window.tickets.filter((t) => {
                const desc = t.description || t.desc || "No description provided"; 
                if (window.currentDateFilter) {
                    let dStr = t.created_at || t.date;
                    if(!dStr) return false;
                    let d = new Date(dStr);
                    if(isNaN(d)) return false;
                    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                    if(key !== window.currentDateFilter) return false;
                }
                if (window.currentDeptFilter !== "All" && t.dept !== window.currentDeptFilter) return false;
                if (window.searchQuery && !t.name.toLowerCase().includes(window.searchQuery) && !desc.toLowerCase().includes(window.searchQuery) && !t.id.toLowerCase().includes(window.searchQuery)) return false;
                return true;
            });

            // Update stats based on pre-status filter so the counters remain stable when you click them
            document.getElementById('stat-total').innerText = preStatusFiltered.length;
            document.getElementById('stat-open').innerText = preStatusFiltered.filter(t => t.status === 'Open' || t.status === 'Pending').length;
            document.getElementById('stat-resolved').innerText = preStatusFiltered.filter(t => t.status === 'Resolved').length;

            // 2. Now apply the Status filter for the actual list rendering
            const finalFilteredTickets = preStatusFiltered.filter((t) => {
                if (window.currentStatusFilter === 'Open' && t.status !== 'Open' && t.status !== 'Pending') return false;
                if (window.currentStatusFilter === 'Resolved' && t.status !== 'Resolved') return false;
                return true;
            });
            
            window.currentFilteredTickets = finalFilteredTickets; // Save state for CSV Export

            // 3. Visually update the status filter buttons to show which is active without breaking original UI
            const baseAll = "cursor-pointer transition-all px-2 py-1.5 rounded-lg border flex items-center justify-center text-center bg-slate-100 border-slate-300 hover:bg-slate-200";
            const baseOpen = "cursor-pointer transition-all px-2 py-1.5 rounded-lg border flex items-center justify-center text-center bg-amber-100 border-amber-300 hover:bg-amber-200";
            const baseResolved = "cursor-pointer transition-all px-2 py-1.5 rounded-lg border flex items-center justify-center text-center bg-emerald-100 border-emerald-300 hover:bg-emerald-200";
            
            document.getElementById('btn-filter-all').className = window.currentStatusFilter === 'All' ? baseAll + " ring-2 ring-slate-400 ring-offset-1" : baseAll;
            document.getElementById('btn-filter-open').className = window.currentStatusFilter === 'Open' ? baseOpen + " ring-2 ring-amber-400 ring-offset-1" : baseOpen;
            document.getElementById('btn-filter-resolved').className = window.currentStatusFilter === 'Resolved' ? baseResolved + " ring-2 ring-emerald-400 ring-offset-1" : baseResolved;

            if(finalFilteredTickets.length === 0) {
                list.innerHTML = `<div class="p-16 text-center text-slate-500 font-bold text-sm bg-white rounded-2xl border-2 border-slate-200 mx-auto max-w-lg mt-10">No tickets found matching your criteria.</div>`;
                return;
            }

            finalFilteredTickets.forEach((t) => {
                const desc = t.description || t.desc || "No description provided"; 
                const initials = t.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                
                let headerColor = 'bg-slate-100 border-slate-300 text-slate-800';
                let sColor = 'bg-slate-50 border-slate-300 text-slate-700';
                
                if(t.status === 'Resolved') {
                    headerColor = 'bg-emerald-100 border-emerald-300 text-emerald-900';
                    sColor = 'bg-emerald-50 border-emerald-300 text-emerald-700';
                }
                else if(t.status === 'Pending') {
                    headerColor = 'bg-amber-100 border-amber-300 text-amber-900';
                    sColor = 'bg-amber-50 border-amber-300 text-amber-800';
                }

                const pri = t.priority || 'Normal';
                let pColor = 'bg-blue-100 text-blue-800 border border-blue-200';
                if (pri === 'Critical') { pColor = 'bg-red-100 text-red-800 border border-red-300 shadow-sm'; }
                else if (pri === 'High') { pColor = 'bg-orange-100 text-orange-800 border border-orange-300'; }
                else if (pri === 'Low') { pColor = 'bg-slate-200 text-slate-700 border border-slate-300'; }
                
                if (t.status === 'Open' && pri === 'Critical') {
                    headerColor = 'bg-red-100 border-red-300 text-red-900';
                }

                let displayDate = t.date;
                try {
                    let d = new Date(t.created_at || t.date);
                    if(!isNaN(d)) displayDate = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                } catch(e) {}

                let solutionDisplay = `<p class="text-[12px] text-amber-700 font-bold italic mt-3 bg-amber-50 border border-amber-200 inline-block px-3 py-1.5 rounded-lg w-max shadow-sm">Pending Solution...</p>`;
                if(t.solution && t.solution.trim() !== '') {
                    solutionDisplay = `
                        <div class="mt-4 p-4 bg-emerald-50 border border-emerald-200 rounded-xl relative shadow-sm">
                            <span class="absolute -top-2.5 left-4 bg-emerald-100 text-emerald-800 text-[10px] font-black uppercase tracking-widest px-2.5 py-1 rounded-full border border-emerald-300 shadow-sm">Solution Given</span>
                            <p class="text-sm font-bold text-slate-800 leading-relaxed mt-1 whitespace-pre-wrap">${t.solution}</p>
                        </div>
                    `;
                }

                list.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-md border-2 border-slate-300 mb-8 overflow-hidden flex flex-col transform transition hover:shadow-lg mx-1 md:mx-0">
                        
                        <!-- DISTINCT TICKET HEADER -->
                        <div class="${headerColor} px-4 lg:px-6 py-3 md:py-4 flex justify-between items-center border-b-2">
                            <div class="flex items-center gap-3">
                                <span class="font-black text-lg md:text-xl tracking-tight">#${t.id}</span>
                                <span class="bg-white/70 px-3 py-1 rounded-md border border-black/10 text-xs font-black uppercase tracking-widest shadow-sm">${t.status}</span>
                            </div>
                            <div class="text-right hidden sm:block">
                                <span class="text-xs font-black uppercase tracking-widest opacity-60 block">Logged</span>
                                <span class="text-sm font-bold opacity-90">${displayDate}</span>
                            </div>
                        </div>
                        
                        <!-- TICKET BODY -->
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-0 divide-y lg:divide-y-0 lg:divide-x divide-slate-200">
                            
                            <div class="col-span-1 lg:col-span-3 p-5 lg:p-6 flex flex-col bg-white">
                                <div class="flex items-center gap-4 mb-4">
                                    <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center font-black text-slate-500 text-xl border-2 border-slate-200 shadow-inner flex-shrink-0">${initials}</div>
                                    <div class="overflow-hidden">
                                        <p class="font-black text-slate-900 text-base truncate">${t.name}</p>
                                        <p class="text-[13px] font-bold text-slate-600 mt-0.5 truncate">${t.dept}</p>
                                        <p class="text-[11px] font-bold text-slate-400 mt-0.5 uppercase tracking-wider">ID: ${t.empid}</p>
                                    </div>
                                </div>
                                <div class="mt-auto bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                    <p class="text-[10px] uppercase font-black text-slate-400 mb-1.5 tracking-widest">Priority Level</p>
                                    <span class="${pColor} px-3 py-1 rounded-lg text-xs font-black uppercase tracking-widest inline-block">${pri}</span>
                                </div>
                            </div>

                            <div class="col-span-1 lg:col-span-4 p-5 lg:p-6 bg-slate-50/50 flex flex-col">
                                <p class="text-[10px] uppercase font-black text-slate-400 mb-1.5 tracking-widest">Category</p>
                                <p class="font-black text-slate-800 text-sm mb-4 bg-white p-2 rounded-lg border border-slate-200 inline-block w-max shadow-sm">${t.category}</p>
                                
                                <p class="text-[10px] uppercase font-bold text-slate-400 mb-1.5 tracking-widest">Description</p>
                                <div class="text-[13px] md:text-sm font-semibold text-slate-700 leading-relaxed bg-white p-4 rounded-xl border border-slate-200 min-h-[80px] shadow-sm whitespace-pre-wrap">${desc}</div>
                                
                                <div class="mt-4 flex-1">
                                    ${solutionDisplay}
                                </div>
                            </div>

                            <div class="col-span-1 lg:col-span-2 p-5 lg:p-6 flex flex-col justify-start gap-5 bg-white">
                                <div>
                                    <label class="text-[10px] uppercase font-black text-slate-400 mb-2 block tracking-widest">Change Status</label>
                                    <select onchange="window.updateStatus('${t.id}', this.value)" class="${sColor} w-full p-3 rounded-xl font-black text-xs uppercase tracking-widest cursor-pointer shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-colors">
                                        <option value="Open" ${t.status === 'Open' ? 'selected' : ''}>Open</option>
                                        <option value="Pending" ${t.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                        <option value="Resolved" ${t.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-[10px] uppercase font-black text-slate-400 mb-2 block tracking-widest">Assigned IT Agent</label>
                                    <input type="text" value="${t.engineer === 'Unassigned' ? '' : t.engineer}" placeholder="Assign to..." 
                                        onblur="window.assignEngineer('${t.id}', this.value)" class="w-full border-2 border-slate-200 bg-slate-50 hover:bg-white rounded-xl p-3 text-sm font-bold text-slate-800 focus:border-indigo-500 focus:bg-white outline-none transition placeholder:text-slate-400 shadow-sm">
                                </div>
                            </div>

                            <div class="col-span-1 lg:col-span-3 p-5 lg:p-6 bg-slate-50 flex flex-col h-full">
                                <label class="text-[10px] uppercase font-black text-slate-400 mb-2 block tracking-widest">Resolution Notes</label>
                                <textarea id="sol-${t.id}" placeholder="Type solution here..." class="flex-1 w-full p-4 rounded-xl border-2 border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none resize-none text-[16px] md:text-sm font-semibold text-slate-700 shadow-sm min-h-[120px] mb-4">${t.solution || ''}</textarea>
                                
                                <div class="flex gap-3 mt-auto">
                                    <button onclick="window.deleteTicket('${t.id}')" title="Delete Ticket" class="px-4 py-3 md:py-2 bg-white border-2 border-slate-200 text-slate-400 hover:text-red-600 hover:border-red-300 hover:bg-red-50 rounded-xl transition shadow-sm font-bold flex items-center justify-center">
                                        <svg class="w-5 h-5 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                    <button onclick="window.updateSolution('${t.id}', event)" class="flex-1 bg-slate-900 text-white font-black py-3 md:py-2 px-4 rounded-xl hover:bg-indigo-600 active:scale-95 transition shadow-lg uppercase tracking-widest text-xs">
                                        Save Notes
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        };

        window.updateStatus = async function(id, newStatus) {
            try { await supabaseClient.from('tickets').update({ status: newStatus }).eq('id', id); window.loadTickets(); } 
            catch (e) { alert("Failed to update status: " + e.message); }
        };

        window.assignEngineer = async function(id, engName) {
            try { await supabaseClient.from('tickets').update({ engineer: engName.trim() || 'Unassigned' }).eq('id', id); window.loadTickets(); } 
            catch (e) { alert("Failed to assign engineer: " + e.message); }
        };

        window.updateSolution = async function(id, event) {
            const btn = event.target; const textElement = document.getElementById(`sol-${id}`); const text = textElement.value.trim(); const originalText = btn.innerText;
            btn.innerText = "SAVING...";
            try {
                const { error } = await supabaseClient.from('tickets').update({ solution: text }).eq('id', id);
                if(error) throw error;
                btn.innerText = "SAVED!"; btn.classList.replace('bg-slate-900', 'bg-emerald-500'); btn.classList.replace('hover:bg-indigo-600', 'hover:bg-emerald-600');
                const t = window.tickets.find(x => x.id === id); if(t) t.solution = text;
                setTimeout(() => window.renderTable(), 500);
                setTimeout(() => { btn.innerText = originalText; btn.classList.replace('bg-emerald-500', 'bg-slate-900'); btn.classList.replace('hover:bg-emerald-600', 'hover:bg-indigo-600'); }, 2000);
            } catch (e) { alert("Database Error: " + e.message); btn.innerText = "ERROR"; btn.classList.replace('bg-slate-900', 'bg-red-500'); }
        };

        window.deleteTicket = async function(id) {
            if(confirm('Permanently delete this ticket record?')) {
                try { await supabaseClient.from('tickets').delete().eq('id', id); window.loadTickets(); } 
                catch (e) { alert("Failed to delete ticket: " + e.message); }
            }
        };
    </script>
</body>
</html>
