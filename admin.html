<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .view { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .view.active { display: flex; opacity: 1; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 h-screen overflow-hidden">

    <div id="login-view" class="view active items-center justify-center h-screen w-full bg-white">
        <div class="max-w-md w-full p-10 text-center">
            <div class="w-20 h-20 bg-gradient-to-tr from-indigo-600 to-purple-600 text-white rounded-2xl flex items-center justify-center text-3xl font-black mx-auto mb-8 shadow-xl shadow-indigo-200">IT</div>
            <h2 class="text-3xl font-black mb-2 tracking-tight">Admin Portal</h2>
            <p class="text-slate-500 mb-10">Sign in to manage service requests.</p>
            <input type="password" id="admin-pwd" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl mb-4 font-bold tracking-widest text-center focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-lg" placeholder="••••••••">
            <button onclick="loginAdmin()" class="w-full bg-slate-900 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-slate-800 transition shadow-lg hover:-translate-y-0.5 transform">Authenticate</button>
            <p id="login-err" class="text-red-500 text-sm mt-4 font-bold hidden">Invalid credentials.</p>
            <div class="mt-10"><a href="index.html" class="text-slate-400 font-semibold hover:text-slate-800 transition">&larr; Back to User Site</a></div>
        </div>
    </div>

    <div id="dashboard-view" class="view h-screen w-full flex">
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-20">
            <div class="h-20 flex items-center px-8 border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center font-bold text-sm shadow-md">IT</div>
                    <span class="text-lg font-black tracking-tight">Workspace</span>
                </div>
            </div>
            
            <div class="flex-1 px-4 py-6 space-y-1">
                <p class="px-4 text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Menu</p>
                <button id="nav-dashboard" onclick="switchMenu('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 bg-indigo-50 text-indigo-700 rounded-xl font-bold transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    Dashboard
                </button>
            </div>

            <div class="p-4 border-t border-slate-100 space-y-2">
                <button onclick="loadTickets()" class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-indigo-50 text-indigo-600 rounded-lg font-bold text-sm hover:bg-indigo-100 transition">
                    🔄 Refresh Cloud
                </button>
                <button onclick="logoutAdmin()" class="w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-red-50 hover:text-red-600 rounded-xl font-semibold transition">
                    Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-10 shadow-sm">
                <h1 id="header-title" class="text-2xl font-black tracking-tight">Overview</h1>
                <input type="text" oninput="searchTable(this.value)" placeholder="Search tickets..." class="bg-slate-50 border border-slate-200 rounded-full pl-6 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64 transition">
            </header>

            <div class="flex-1 overflow-y-auto p-8">
                
                <div id="metrics-section" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between h-36">
                        <p class="text-sm font-bold text-slate-500">Total Requests</p>
                        <h3 class="text-4xl font-black text-slate-800" id="stat-total">-</h3>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between h-36">
                        <p class="text-sm font-bold text-slate-500">Needs Attention</p>
                        <h3 class="text-4xl font-black text-amber-500" id="stat-open">-</h3>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between h-36">
                        <p class="text-sm font-bold text-slate-500">Resolved</p>
                        <h3 class="text-4xl font-black text-emerald-500" id="stat-resolved">-</h3>
                    </div>
                </div>

                <div id="tickets-section" class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden mb-10">
                    <div class="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-white">
                        <h2 class="text-lg font-black text-slate-800">Support Queue</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-xs font-bold text-slate-400 uppercase tracking-wider bg-slate-50/50 border-b border-slate-100">
                                    <th class="p-6">Employee</th>
                                    <th class="p-6">Request Details</th>
                                    <th class="p-6">Date</th>
                                    <th class="p-6">Status</th>
                                    <th class="p-6">Assignee</th>
                                    <th class="p-6 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body" class="divide-y divide-slate-100">
                                <tr><td colspan="6" class="p-16 text-center text-slate-400 font-bold text-lg">Loading from Cloud...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // Supabase Connection using the keys you provided
        const SUPABASE_URL = 'https://lyeezqunskbluichzljx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCYOWoQORp8fBeyOPtCrhEl5kuy6jmeWiU';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let tickets = [];
        let searchQuery = "";

        document.getElementById('admin-pwd').addEventListener('keypress', e => { if (e.key === 'Enter') loginAdmin(); });
        window.onload = () => { if (sessionStorage.getItem('admin_logged_in') === 'true') showDashboard(); };

        function loginAdmin() {
            if(document.getElementById('admin-pwd').value === 'admin123') {
                sessionStorage.setItem('admin_logged_in', 'true');
                showDashboard();
            } else {
                document.getElementById('login-err').classList.remove('hidden');
            }
        }
        
        function showDashboard() {
            document.getElementById('login-view').classList.remove('active');
            document.getElementById('dashboard-view').classList.add('active');
            loadTickets();
        }
        
        function logoutAdmin() {
            sessionStorage.removeItem('admin_logged_in');
            window.location.reload();
        }

        function switchMenu(page) {
            // Simplified for brevity
        }

        async function loadTickets() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = `<tr><td colspan="6" class="p-16 text-center text-indigo-500 font-bold text-lg animate-pulse">Syncing with cloud database...</td></tr>`;

            const { data, error } = await supabase
                .from('tickets')
                .select('*')
                .order('created_at', { ascending: false });

            if(error) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-16 text-center text-red-500 font-bold text-lg">Error connecting to cloud: ${error.message}</td></tr>`;
                return;
            }

            tickets = data || [];
            
            document.getElementById('stat-total').innerText = tickets.length;
            document.getElementById('stat-open').innerText = tickets.filter(t => t.status === 'Open' || t.status === 'Pending').length;
            document.getElementById('stat-resolved').innerText = tickets.filter(t => t.status === 'Resolved').length;

            renderTable();
        }

        function searchTable(query) {
            searchQuery = query.toLowerCase();
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';
            let displayCount = 0;
            
            if(tickets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-16 text-center text-slate-400 font-bold text-lg">Cloud database is empty.</td></tr>`;
                return;
            }

            tickets.forEach((t) => {
                const desc = t.description || t.desc || "No description provided"; 
                if (searchQuery && !t.name.toLowerCase().includes(searchQuery) && !desc.toLowerCase().includes(searchQuery) && !t.id.toLowerCase().includes(searchQuery)) return;
                displayCount++;

                const initials = t.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                
                let sColor = t.status === 'Resolved' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : (t.status === 'Pending' ? 'bg-amber-50 text-amber-600 border-amber-200' : 'bg-indigo-50 text-indigo-600 border-indigo-200');
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50/80 transition group bg-white">
                        <td class="p-6">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-500 border border-slate-200">${initials}</div>
                                <div>
                                    <p class="font-bold text-slate-800">${t.name}</p>
                                    <p class="text-xs font-semibold text-slate-500">${t.dept} &bull; ${t.empid}</p>
                                </div>
                            </div>
                        </td>
                        <td class="p-6">
                            <p class="font-bold text-slate-700 text-sm mb-1">${t.id} &bull; ${t.category}</p>
                            <p class="text-sm text-slate-500 truncate w-48" title="${desc}">${desc}</p>
                        </td>
                        <td class="p-6">
                            <span class="text-sm font-semibold text-slate-600">${t.date}</span>
                        </td>
                        <td class="p-6">
                            <select onchange="updateStatus('${t.id}', this.value)" class="${sColor} px-3 py-1.5 rounded-full font-bold text-xs uppercase tracking-wider cursor-pointer focus:outline-none border">
                                <option value="Open" ${t.status === 'Open' ? 'selected' : ''}>Open</option>
                                <option value="Pending" ${t.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Resolved" ${t.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                            </select>
                        </td>
                        <td class="p-6">
                            <input type="text" value="${t.engineer === 'Unassigned' ? '' : t.engineer}" placeholder="Assignee..." 
                                onblur="assignEngineer('${t.id}', this.value)" class="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 p-1 w-28 text-sm font-bold text-slate-700 focus:outline-none transition placeholder:text-slate-300">
                        </td>
                        <td class="p-6 text-right">
                            <button onclick="deleteTicket('${t.id}')" title="Delete Ticket" class="text-slate-300 hover:text-red-500 font-bold transition p-2 rounded-lg hover:bg-red-50 inline-flex items-center justify-center">
                                🗑️
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        async function updateStatus(id, newStatus) {
            await supabase.from('tickets').update({ status: newStatus }).eq('id', id);
            loadTickets(); 
        }

        async function assignEngineer(id, engName) {
            await supabase.from('tickets').update({ engineer: engName.trim() || 'Unassigned' }).eq('id', id);
            loadTickets();
        }

        async function deleteTicket(id) {
            if(confirm('Delete this ticket permanently from the cloud?')) {
                await supabase.from('tickets').delete().eq('id', id);
                loadTickets();
            }
        }
    </script>
</body>
</html>
