<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .view { display: none; opacity: 0; transition: opacity 0.4s ease; }
        .view.active { display: flex; opacity: 1; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 h-screen overflow-hidden">

    <!-- SECURE LOGIN VIEW -->
    <div id="login-view" class="view active items-center justify-center h-screen w-full bg-white px-4">
        <div class="max-w-md w-full p-8 md:p-10 text-center">
            <div class="w-20 h-20 bg-gradient-to-tr from-indigo-600 to-purple-600 text-white rounded-2xl flex items-center justify-center text-3xl font-black mx-auto mb-8 shadow-xl shadow-indigo-200">IT</div>
            <h2 class="text-3xl font-black mb-2 tracking-tight">Admin Portal</h2>
            <p class="text-slate-500 mb-10">Sign in securely to manage service requests.</p>
            
            <form onsubmit="window.loginAdmin(event)" class="space-y-4">
                <input type="email" id="admin-email" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl font-bold text-center focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-lg" placeholder="admin@company.com" required>
                <input type="password" id="admin-pwd" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl font-bold tracking-widest text-center focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-lg" placeholder="••••••••" required>
                <button id="login-btn" type="submit" class="w-full bg-slate-900 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-slate-800 transition shadow-lg hover:-translate-y-0.5 transform">Authenticate</button>
            </form>
            
            <p id="login-err" class="text-red-500 text-sm mt-4 font-bold hidden">Invalid credentials.</p>
            <div class="mt-10"><a href="index.html" class="text-slate-400 font-semibold hover:text-slate-800 transition">&larr; Back to User Site</a></div>
        </div>
    </div>

    <!-- MOBILE OVERLAY -->
    <div id="mobile-overlay" onclick="window.toggleSidebar()" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden transition-opacity"></div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard-view" class="view h-screen w-full flex relative overflow-hidden">
        
        <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col z-50 absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-300 ease-in-out h-full shadow-2xl md:shadow-none">
            <button onclick="window.toggleSidebar()" class="md:hidden absolute top-6 right-6 text-slate-400 hover:text-slate-700 font-black text-xl">&times;</button>
            <div class="h-20 flex items-center px-8 border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center font-bold text-sm shadow-md">IT</div>
                    <span class="text-lg font-black tracking-tight">Workspace</span>
                </div>
            </div>
            <div class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
                <p class="px-4 text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Menu</p>
                <button id="nav-dashboard" onclick="window.switchMenu('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 bg-indigo-50 text-indigo-700 rounded-xl font-bold transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    Dashboard
                </button>
            </div>
            <div class="p-4 border-t border-slate-100 space-y-2">
                <button onclick="window.loadTickets()" class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-indigo-50 text-indigo-600 rounded-lg font-bold text-sm hover:bg-indigo-100 transition">🔄 Refresh Cloud</button>
                <button onclick="window.logoutAdmin()" class="w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-red-50 hover:text-red-600 rounded-xl font-semibold transition">Logout</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen w-full overflow-hidden relative">
            <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-8 z-10 shadow-sm flex-shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="window.toggleSidebar()" class="md:hidden text-slate-500 hover:text-indigo-600 focus:outline-none bg-slate-50 p-2 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <h1 id="header-title" class="text-lg md:text-2xl font-black tracking-tight">Overview</h1>
                </div>
                <input type="text" oninput="window.searchTable(this.value)" placeholder="Search tickets..." class="bg-slate-50 border border-slate-200 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-32 md:w-64 transition">
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8 w-full">
                
                <div id="metrics-section" class="grid grid-cols-1 sm:grid-cols-3 gap-4 md:gap-6 mb-8">
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between h-32 md:h-36">
                        <p class="text-sm font-bold text-slate-500">Total Requests</p>
                        <h3 class="text-3xl md:text-4xl font-black text-slate-800" id="stat-total">-</h3>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between h-32 md:h-36">
                        <p class="text-sm font-bold text-slate-500">Needs Attention</p>
                        <h3 class="text-3xl md:text-4xl font-black text-amber-500" id="stat-open">-</h3>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between h-32 md:h-36">
                        <p class="text-sm font-bold text-slate-500">Resolved</p>
                        <h3 class="text-3xl md:text-4xl font-black text-emerald-500" id="stat-resolved">-</h3>
                    </div>
                </div>

                <div id="tickets-section" class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden mb-10 w-full">
                    <div class="px-6 py-4 md:px-8 md:py-6 border-b border-slate-100 flex justify-between items-center bg-white">
                        <h2 class="text-lg font-black text-slate-800">Support Queue</h2>
                    </div>
                    <div class="overflow-x-auto w-full">
                        <table class="w-full text-left border-collapse min-w-[900px]">
                            <thead>
                                <tr class="text-xs font-bold text-slate-400 uppercase tracking-wider bg-slate-50/50 border-b border-slate-100">
                                    <th class="p-4 md:p-6">Employee</th>
                                    <th class="p-4 md:p-6">Request Details</th>
                                    <th class="p-4 md:p-6">Status</th>
                                    <th class="p-4 md:p-6">Assignee</th>
                                    <th class="p-4 md:p-6">Resolution Notes</th>
                                    <th class="p-4 md:p-6 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body" class="divide-y divide-slate-100">
                                <tr><td colspan="6" class="p-16 text-center text-slate-400 font-bold text-lg">Loading from Cloud...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://lyeezqunskbluichzljx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5ZWV6cXVuc2tibHVpY2h6bGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzY0NTAsImV4cCI6MjEwNjYxMjQ1MH0.1zyQs2R0C6XYOWoQORp8fBeyOPtCrhEl5kuy6jmeWiU';
        
        let supabaseClient;
        try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } 
        catch(e) { console.error("Supabase Initialization Error:", e); }

        window.tickets = [];
        window.searchQuery = "";

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        };

        window.onload = async () => { 
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.showDashboard();
            }
        };

        window.loginAdmin = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errDiv = document.getElementById('login-err');
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-pwd').value;

            btn.innerText = "Authenticating...";
            btn.disabled = true;
            errDiv.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errDiv.innerText = error.message;
                errDiv.classList.remove('hidden');
                btn.innerText = "Authenticate";
                btn.disabled = false;
            } else {
                window.showDashboard();
            }
        };
        
        window.showDashboard = function() {
            document.getElementById('login-view').classList.remove('active');
            document.getElementById('dashboard-view').classList.add('active');
            window.loadTickets();
        };
        
        window.logoutAdmin = async function() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        };

        window.switchMenu = function(page) {};

        window.loadTickets = async function() {
            if(!supabaseClient) return alert("Database connection is missing.");
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = `<tr><td colspan="6" class="p-16 text-center text-indigo-500 font-bold text-lg animate-pulse">Syncing with cloud database...</td></tr>`;

            try {
                // Fetch chronologically first (newest tickets on top)
                const { data, error } = await supabaseClient.from('tickets').select('*').order('created_at', { ascending: false });
                if(error) throw error;
                
                let fetchedTickets = data || [];
                
                // --- NEW: SMART SORTING LOGIC ---
                // Weights: Open = 1, Pending = 2, Resolved = 3
                const statusWeight = { 'Open': 1, 'Pending': 2, 'Resolved': 3 };
                
                fetchedTickets.sort((a, b) => {
                    const weightA = statusWeight[a.status] || 4;
                    const weightB = statusWeight[b.status] || 4;
                    return weightA - weightB;
                });
                
                window.tickets = fetchedTickets;
                // ---------------------------------
                
                document.getElementById('stat-total').innerText = window.tickets.length;
                document.getElementById('stat-open').innerText = window.tickets.filter(t => t.status === 'Open' || t.status === 'Pending').length;
                document.getElementById('stat-resolved').innerText = window.tickets.filter(t => t.status === 'Resolved').length;
                window.renderTable();
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-16 text-center text-red-500 font-bold text-lg">Error connecting to cloud: ${error.message}</td></tr>`;
            }
        };

        window.searchTable = function(query) {
            window.searchQuery = query.toLowerCase();
            window.renderTable();
        };

        window.renderTable = function() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';
            let displayCount = 0;
            
            if(window.tickets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-16 text-center text-slate-400 font-bold text-lg">Cloud database is empty.</td></tr>`;
                return;
            }

            window.tickets.forEach((t) => {
                const desc = t.description || t.desc || "No description provided"; 
                if (window.searchQuery && !t.name.toLowerCase().includes(window.searchQuery) && !desc.toLowerCase().includes(window.searchQuery) && !t.id.toLowerCase().includes(window.searchQuery)) return;
                displayCount++;

                const initials = t.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                const sColor = t.status === 'Resolved' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : (t.status === 'Pending' ? 'bg-amber-50 text-amber-600 border-amber-200' : 'bg-indigo-50 text-indigo-600 border-indigo-200');
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50/80 transition group bg-white">
                        <td class="p-4 md:p-6 min-w-[200px]">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-500 border border-slate-200 flex-shrink-0">${initials}</div>
                                <div>
                                    <p class="font-bold text-slate-800">${t.name}</p>
                                    <p class="text-xs font-semibold text-slate-500">${t.dept} &bull; ${t.empid}</p>
                                </div>
                            </div>
                        </td>
                        <td class="p-4 md:p-6">
                            <p class="font-bold text-slate-700 text-sm mb-1">${t.id} &bull; ${t.category}</p>
                            <p class="text-sm text-slate-500 truncate w-32 md:w-40" title="${desc}">${desc}</p>
                        </td>
                        <td class="p-4 md:p-6">
                            <select onchange="window.updateStatus('${t.id}', this.value)" class="${sColor} px-3 py-1.5 rounded-full font-bold text-xs uppercase tracking-wider cursor-pointer focus:outline-none border">
                                <option value="Open" ${t.status === 'Open' ? 'selected' : ''}>Open</option>
                                <option value="Pending" ${t.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Resolved" ${t.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                            </select>
                        </td>
                        <td class="p-4 md:p-6">
                            <input type="text" value="${t.engineer === 'Unassigned' ? '' : t.engineer}" placeholder="Assignee..." 
                                onblur="window.assignEngineer('${t.id}', this.value)" class="bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 p-1 w-24 text-sm font-bold text-slate-700 focus:outline-none transition placeholder:text-slate-300">
                        </td>
                        <td class="p-4 md:p-6">
                            <div class="flex flex-col gap-2">
                                <textarea id="sol-${t.id}" placeholder="Type solution..." class="bg-slate-50 border border-slate-200 p-2 rounded-lg w-32 md:w-40 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition resize-none h-16">${t.solution || ''}</textarea>
                                <button onclick="window.updateSolution('${t.id}', event)" class="bg-indigo-100 text-indigo-700 text-xs font-bold py-1.5 rounded-lg hover:bg-indigo-200 transition text-center">Save Note</button>
                            </div>
                        </td>
                        <td class="p-4 md:p-6 text-right">
                            <button onclick="window.deleteTicket('${t.id}')" title="Delete Ticket" class="text-slate-300 hover:text-red-500 font-bold transition p-2 rounded-lg hover:bg-red-50 inline-flex items-center justify-center">
                                🗑
                            </button>
                        </td>
                    </tr>
                `;
            });
        };

        window.updateStatus = async function(id, newStatus) {
            try {
                await supabaseClient.from('tickets').update({ status: newStatus }).eq('id', id);
                window.loadTickets(); 
            } catch (e) { alert("Failed to update status: " + e.message); }
        };

        window.assignEngineer = async function(id, engName) {
            try {
                await supabaseClient.from('tickets').update({ engineer: engName.trim() || 'Unassigned' }).eq('id', id);
                window.loadTickets();
            } catch (e) { alert("Failed to assign engineer: " + e.message); }
        };

        window.updateSolution = async function(id, event) {
            const btn = event.target;
            const textElement = document.getElementById(`sol-${id}`);
            const text = textElement.value.trim();
            
            btn.innerText = "Saving...";
            
            try {
                const { error } = await supabaseClient.from('tickets').update({ solution: text }).eq('id', id);
                if(error) throw error;
                
                btn.innerText = "Saved!";
                btn.classList.replace('bg-indigo-100', 'bg-emerald-100');
                btn.classList.replace('text-indigo-700', 'text-emerald-700');
                
                setTimeout(() => { 
                    btn.innerText = "Save Note"; 
                    btn.classList.replace('bg-emerald-100', 'bg-indigo-100');
                    btn.classList.replace('text-emerald-700', 'text-indigo-700');
                }, 2000);
                
            } catch (e) { 
                alert("Database Error: " + e.message);
                btn.innerText = "Error!";
            }
        };

        window.deleteTicket = async function(id) {
            if(confirm('Delete this ticket permanently from the cloud?')) {
                try {
                    await supabaseClient.from('tickets').delete().eq('id', id);
                    window.loadTickets();
                } catch (e) { alert("Failed to delete ticket: " + e.message); }
            }
        };
    </script>
</body>
</html>
